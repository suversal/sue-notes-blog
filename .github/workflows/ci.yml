name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sue_notes_blog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sue_notes_blog"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:fast
      - run: pnpm test:unit
      - run: pnpm test:int
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55433/sue_notes_blog
          PAYLOAD_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
